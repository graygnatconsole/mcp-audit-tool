[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit-tool"
version = "1.0.0"
description = "Security audit CLI for Model Context Protocol (MCP) servers — detect tool poisoning, rug pulls, hardcoded secrets, command injection and supply-chain risks in AI agent configs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GrayGnatConsole" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "audit",
    "llm-security",
    "ai-security",
    "mcp-server",
    "claude",
    "supply-chain-security",
    "sarif",
    "devsecops",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/graygnatconsole/mcp-audit-tool"
Repository = "https://github.com/graygnatconsole/mcp-audit-tool"
Issues = "https://github.com/graygnatconsole/mcp-audit-tool/issues"

[project.scripts]
mcp-audit = "mcp_audit_tool.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
